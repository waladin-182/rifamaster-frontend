<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talonario | RifaMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__brand"><span class="dot">●</span> RifaMaster</a>
</nav>

<main class="container" style="max-width:820px;">
  <div id="content"><p class="spinner-text">Cargando talonario...</p></div>
</main>

<footer class="site-footer">RifaMaster · Talonario digital para rifas y sorteos</footer>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");
const content = document.getElementById("content");
const statusLabel = { published: "Ventas abiertas", closed: "Ventas cerradas", drawn: "Sorteada" };

let raffleData = null;

async function load() {
  if (!slug) {
    showError(content, "Falta el identificador de la rifa.");
    return;
  }
  try {
    const data = await api(`/raffles/public/${slug}`);
    raffleData = data;
    render(data);
  } catch (err) {
    showError(content, err.message);
  }
}

function render({ raffle, tickets }) {
  content.innerHTML = `
    ${raffle.bannerUrl ? `<div style="height:180px; border-radius:14px; background-size:cover; background-position:center; background-image:url('${raffle.bannerUrl}'); margin:20px 0;"></div>` : ""}
    <span class="badge badge--${raffle.status}">${statusLabel[raffle.status] || raffle.status}</span>
    <h1 style="margin:8px 0 4px;">${raffle.title}</h1>
    <p>${raffle.description || ""}</p>
    <p style="font-size:15px;"><strong>🏆 Premio:</strong> ${raffle.prize}${raffle.prizeValue ? ` (aprox. ${formatMoney(raffle.prizeValue, raffle.currency)})` : ""}</p>
    <p style="font-size:15px;"><strong>💵 Precio por número:</strong> ${formatMoney(raffle.pricePerTicket, raffle.currency)}</p>
    ${raffle.drawDate ? `<p style="font-size:15px;"><strong>📅 Fecha del sorteo:</strong> ${new Date(raffle.drawDate).toLocaleDateString("es-CO")}</p>` : ""}

    ${raffle.paymentMethods.length ? `
      <h3 style="margin-top:24px;">Métodos de pago</h3>
      <div class="pm-list">
        ${raffle.paymentMethods.map(pm => `
          <div class="pm-item">
            <span class="pm-type">${pm.type}</span>
            <span>${pm.numberOrAccount}${pm.holderName ? ` · ${pm.holderName}` : ""}</span>
          </div>
        `).join("")}
      </div>` : ""}

    ${raffle.status === "drawn" ? `
      <div class="card" style="margin:24px 0; border-color:var(--gold); text-align:center;">
        <h2 style="margin-bottom:4px;">🎉 Número ganador</h2>
        <div style="font-family:var(--font-mono); font-size:38px; color:var(--gold); font-weight:700;">${raffle.winningTicket}</div>
      </div>
    ` : `
      <h3 style="margin-top:28px;">Elige tu número</h3>
      <div class="legend">
        <span><i style="background:rgba(251,247,238,.08); border:1px solid var(--line);"></i> Disponible</span>
        <span><i style="background:rgba(232,184,75,.5);"></i> Reservado</span>
        <span><i style="background:rgba(232,87,75,.5);"></i> Confirmado</span>
      </div>
      <div class="ticket-grid" id="grid"></div>
    `}
  `;

  if (raffle.status === "published") {
    const grid = document.getElementById("grid");
    grid.innerHTML = tickets.map(t => `<div class="ticket-cell ${t.status}" data-num="${t.number}">${t.number}</div>`).join("");
    grid.querySelectorAll(".ticket-cell.available").forEach(cell => {
      cell.addEventListener("click", () => openModal(cell.dataset.num, raffle));
    });
  }
}

function openModal(number, raffle) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Apartar el número ${number}</h3>
      <p style="font-size:14px;">Completa tus datos. El organizador confirmará tu pago para asegurar tu cupo.</p>
      <div id="modalMsg"></div>
      <form id="reserveForm">
        <div class="field"><label>Nombre completo</label><input id="rName" required></div>
        <div class="field"><label>Cédula</label><input id="rId"></div>
        <div class="field"><label>Teléfono</label><input id="rPhone" required></div>
        <div class="field"><label>Email (opcional)</label><input id="rEmail" type="email"></div>
        <div class="field">
          <label>Método de pago</label>
          <select id="rMethod">
            ${raffle.paymentMethods.map(pm => `<option value="${pm.type}">${pm.type} - ${pm.numberOrAccount}</option>`).join("") || '<option value="efectivo">Efectivo</option>'}
          </select>
        </div>
        <div class="field">
          <label>Comprobante de pago (opcional, puedes subirlo después)</label>
          <input id="rProof" type="file" accept="image/png,image/jpeg,image/webp">
          <p class="hint">Si ya hiciste la transferencia, adjunta la foto o captura del comprobante para agilizar la confirmación.</p>
        </div>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button type="button" class="btn btn--ghost" id="cancelBtn" style="flex:1;">Cancelar</button>
          <button type="submit" class="btn btn--primary" style="flex:1;" id="confirmReserveBtn">Apartar número</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(backdrop);

  backdrop.querySelector("#cancelBtn").addEventListener("click", () => backdrop.remove());
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });

  backdrop.querySelector("#reserveForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = backdrop.querySelector("#modalMsg");
    const btn = backdrop.querySelector("#confirmReserveBtn");
    btn.disabled = true;
    btn.textContent = "Apartando...";
    try {
      const proofFile = backdrop.querySelector("#rProof").files[0];
      const paymentProof = await fileToBase64(proofFile);
      const phone = backdrop.querySelector("#rPhone").value;

      const data = await api(`/tickets/public/${slug}/reserve`, {
        method: "POST",
        body: {
          number,
          name: backdrop.querySelector("#rName").value,
          idNumber: backdrop.querySelector("#rId").value,
          phone,
          email: backdrop.querySelector("#rEmail").value,
          paymentMethod: backdrop.querySelector("#rMethod").value,
          paymentProof,
        },
      });
      backdrop.querySelector(".modal").innerHTML = `
        <h3>¡Número ${number} apartado! 🎟️</h3>
        <p style="font-size:14px;">${data.message}</p>
        <img src="${data.ticket.qrCode}" alt="QR del ticket" style="width:100%; max-width:220px; display:block; margin:16px auto; border-radius:10px;">
        ${paymentProof ? "" : `
          <p class="hint">¿Ya hiciste el pago? Puedes adjuntar tu comprobante ahora.</p>
          <input id="laterProof" type="file" accept="image/png,image/jpeg,image/webp" style="margin-bottom:10px;">
          <div id="laterProofMsg"></div>
          <button class="btn btn--ghost" style="width:100%; margin-bottom:8px;" id="uploadLaterBtn">Subir comprobante</button>
        `}
        <button class="btn btn--gold" style="width:100%;" onclick="window.location.reload()">Listo</button>
      `;

      const uploadLaterBtn = backdrop.querySelector("#uploadLaterBtn");
      if (uploadLaterBtn) {
        uploadLaterBtn.addEventListener("click", async () => {
          const laterMsg = backdrop.querySelector("#laterProofMsg");
          try {
            const file = backdrop.querySelector("#laterProof").files[0];
            const proof = await fileToBase64(file);
            if (!proof) throw new Error("Selecciona una imagen primero.");
            await api(`/tickets/public/${slug}/ticket/${number}/proof`, {
              method: "POST",
              body: { phone, paymentProof: proof },
            });
            showSuccess(laterMsg, "Comprobante enviado. ¡Gracias!");
            uploadLaterBtn.disabled = true;
          } catch (err2) {
            showError(laterMsg, err2.message);
          }
        });
      }
    } catch (err) {
      showError(msg, err.message);
      btn.disabled = false;
      btn.textContent = "Apartar número";
    }
  });
}

load();
</script>
</body>
</html>
