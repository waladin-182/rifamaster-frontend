<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | RifaMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card">
    <h1>Crea tu cuenta</h1>
    <p class="sub">Empieza a organizar tu rifa en minutos.</p>

    <div id="msg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Nombre completo</label>
        <input id="name" type="text" placeholder="Tu nombre" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="phone">Teléfono (opcional)</label>
        <input id="phone" type="tel" placeholder="300 000 0000">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Mínimo 6 caracteres" required>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;" id="submitBtn">Crear cuenta</button>
    </form>

    <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  msg.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Creando cuenta...";

  try {
    const data = await api("/auth/register", {
      method: "POST",
      body: {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        password: document.getElementById("password").value,
      },
    });
    Auth.setSession(data.token, data.user);
    window.location.href = "dashboard.html";
  } catch (err) {
    showError(msg, err.message);
    btn.disabled = false;
    btn.textContent = "Crear cuenta";
  }
});
</script>
</body>
</html>
