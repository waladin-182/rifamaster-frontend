<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | RifaMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card">
    <h1>Bienvenido de nuevo</h1>
    <p class="sub">Inicia sesión para gestionar tus rifas.</p>

    <div id="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;" id="submitBtn">Iniciar sesión</button>
    </form>

    <p class="auth-switch">¿Aún no tienes cuenta? <a href="register.html">Regístrate</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  msg.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Ingresando...";

  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      },
    });
    Auth.setSession(data.token, data.user);
    window.location.href = "dashboard.html";
  } catch (err) {
    showError(msg, err.message);
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
  }
});
</script>
</body>
</html>
